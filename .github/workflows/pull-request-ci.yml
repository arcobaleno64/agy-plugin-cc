name: Pull Request CI
on:
  pull_request:
  # Also on any branch push except main. Four of the suite's tests are
  # platform-bound (two Windows-only, two keychain tests skipped off Linux and
  # macOS), so a branch that never opens a PR has no way to run them — the
  # maintainer's local run is one platform out of three. `workflow_dispatch`
  # cannot fill that gap: GitHub only offers it for workflows already present
  # on the default branch, which a not-yet-merged branch is not.
  #
  # main is excluded because every commit reaching it has already been through
  # this workflow as a pull request.
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  aeo-node18:
    # package.json supports Node >=18. Keep the dependency-free observation
    # harness honest on the oldest supported major without duplicating the full
    # three-platform suite below.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 18
      - run: node --test tests/aeo-benchmark.test.mjs
      - run: npm run bench:aeo

  ci:
    # Windows is not redundant here. Four tests are Windows-only by construction
    # (`skip: process.platform !== "win32"`) because they assert cmd.exe
    # behaviour: that a resolved command passes argv literally, that %PATH% is
    # not expanded in an argument, and that a stand-in earlier in PATH wins over
    # a real install behind it. On Linux alone they never ran, so a change that
    # broke the Windows spawn path would have gone green — the plugin's argv
    # handling and shim resolution are the most platform-specific code it has.
    # Five other tests are the mirror image (`skip: === "win32"`) and still need
    # Linux, so both legs carry assertions the other cannot.
    #
    # macOS earns its place the same way. The keychain probe branches three ways
    # by platform, and only one branch runs per leg: Windows resolves cmdkey in
    # System32, Linux resolves secret-tool, and `security` exists on neither. Its
    # branch had therefore never executed on any runner — it was covered only by
    # tests that simulate darwin, and a simulated platform is exactly what let a
    # green Windows build hide a red Linux one in this file's history. On macOS
    # the probe really does spawn `security find-generic-password`, which is
    # read-only and, on a runner whose keychain holds no gemini entry, exits 44
    # and reports absence.
    runs-on: ${{ matrix.os }}
    strategy:
      # Run both to completion: a Windows failure must not cancel Linux, or the
      # first red build hides whether the problem is platform-specific.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # Raised from 10: the Windows runner is slower at npm ci and at the ~350-test
    # suite, which spawns a Node process per background-job case.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Deterministic replay of the committed cassettes. This guards the
      # orchestrator, the scorer, and the scorecard's verdict rules — including
      # the rule that a seeded cassette cannot win an axis.
      #
      # It does NOT tell you whether a change made reviews better or worse. No
      # engine runs here: replay reads recorded outputs, so a PR that rewrites a
      # prompt or reroutes an engine passes this untouched. Reviewing quality is
      # measured by re-recording (`npm run bench:live`), which needs credentials
      # and a TTY and therefore happens on a maintainer's machine.
      - run: npm run bench
      - run: npm run check-version
      - run: npm run verify-contracts
      # verify-contracts checks version lockstep and the command surface; it does
      # not schema-check the manifests themselves. `claude plugin validate` does,
      # and it needs no credentials — verified against an empty CLAUDE_CONFIG_DIR.
      # Pinned so a Claude Code release cannot change this gate without a commit.
      - run: npm install -g @anthropic-ai/claude-code@2.1.222
      - run: claude plugin validate ./plugins/gemini --strict
      - run: claude plugin validate . --strict
